<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Superagent · 个人助理</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">s<span>·</span></span><span>Superagent<small>个人多任务助理</small></span></a><div class="top-status"><span id="connection" class="connection"><i></i>连接中</span><button id="environment-button" class="model-chip">模型配置</button></div></header>
<div id="connection-banner" class="banner" role="status" hidden></div>
<nav class="mobile-nav" aria-label="工作区"><button data-panel="tasks">任务</button><button data-panel="chat" class="selected">总聊天</button><button data-panel="detail">任务详情</button></nav>
<main class="workspace" data-mobile-panel="chat">
<aside class="task-panel panel"><div class="panel-heading"><div><span class="eyebrow">WORKSPACE</span><h2>进行中的工作 <span id="task-count">0</span></h2></div><button id="refresh" class="icon-button" aria-label="刷新">↻</button></div><div class="list-tools"><input id="task-search" type="search" placeholder="搜索任务" aria-label="搜索任务"><select id="task-filter" aria-label="任务状态"><option value="all">全部</option><option value="active">进行中</option><option value="attention">需处理</option><option value="completed">已完成</option></select></div><div id="task-list" class="task-list"></div><div class="list-footer"><span id="worker-count">0 个任务运行中</span><span id="worker-limit"></span></div></aside>
<section class="chat-panel panel"><div class="chat-heading"><div><span class="eyebrow">ROUTER</span><h1>把事情交给助理</h1></div><button id="new-conversation" class="text-button">＋ 新聊天</button></div><div class="conversation-bar"><select id="conversation-select" aria-label="选择聊天"></select><span id="router-status" class="subtle">随时可以开始</span></div><div id="chat-messages" class="chat-messages" aria-live="polite"></div><div id="router-error" class="inline-error" hidden></div><form id="chat-form" class="composer"><label for="chat-text" class="sr-only">给助理的要求</label><textarea id="chat-text" rows="3" maxlength="16000" placeholder="说说你想完成什么，可以同时安排多件事…" required></textarea><div class="composer-bottom"><span>Enter 发送 · Shift + Enter 换行</span><button type="submit" class="primary" id="send-chat">发送 <span>↑</span></button></div></form><div class="usage-line" id="usage-line">任务进展与执行结果会保留在这里</div></section>
<section id="detail-panel" class="detail-panel panel"><div id="detail-empty" class="empty detail-placeholder"><span class="empty-icon">↗</span><h2>看见每一步进展</h2><p>从左侧选择一个任务，查看它的执行记录、结果，或继续补充要求。</p></div><div id="detail-selected" hidden><div class="detail-heading"><div class="detail-topline"><span class="eyebrow">WORKER</span><span id="detail-status"></span></div><h2 id="detail-title"></h2><div id="detail-id" class="mono subtle"></div><p id="detail-summary"></p><div id="detail-actions" class="detail-actions"></div></div><nav class="detail-tabs" aria-label="任务详情"><button data-tab="activity" class="selected">执行过程</button><button data-tab="result">交付结果</button><button data-tab="messages">任务对话</button></nav><div class="run-bar" id="run-bar"><label for="run-select">执行记录</label><select id="run-select"></select></div><div id="detail-content" class="detail-content"></div><form id="followup-form" class="followup-form"><label for="followup-text" class="sr-only">补充当前任务</label><textarea id="followup-text" rows="2" maxlength="16000" placeholder="补充这个任务的要求…" required></textarea><div class="followup-bottom"><span>发送给这个任务的 Worker</span><button type="submit" class="secondary">发送 ↑</button></div></form></div></section>
</main>
<dialog id="environment-dialog"><div class="dialog-title"><div><span class="eyebrow">CONNECTIONS</span><h2>运行环境</h2></div><button id="close-environment" class="icon-button" aria-label="关闭">×</button></div><div id="environment-content"></div><p class="dialog-note">任务使用本机工具和当前用户的 GitHub 登录。模型凭证不会显示在页面中。</p></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body></html>
